services:
  config-server:
    image: library-config-server
    build:
      context: ./config-server
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=default
    networks:
      - library-network
    expose:
      - 8888
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  gateway:
    image: library-gateway
    build:
      context: ./gateway
      dockerfile: Dockerfile
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_CLOUD_CONSUL_HOST=consul
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - library-network
    restart: on-failure

  user-service:
    image: library-user-service
    build:
      context: ./user-service
      dockerfile: Dockerfile
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/userdb
      - SPRING_DATASOURCE_USERNAME=bereketab24
      - SPRING_DATASOURCE_PASSWORD=bereketab24
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      config-server:
        condition: service_healthy
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - library-network
    expose:
      - 8081
    restart: on-failure

  book-service:
    image: library-book-service
    build:
      context: ./book-service
      dockerfile: Dockerfile
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/bookdb
      - SPRING_DATASOURCE_USERNAME=bereketab24
      - SPRING_DATASOURCE_PASSWORD=bereketab24
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/Library_img
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      config-server:
        condition: service_healthy
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - library-network
    expose:
      - 8082
    restart: on-failure

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_MULTIPLE_DATABASES=userdb,bookdb
      - POSTGRES_USER=bereketab24
      - POSTGRES_PASSWORD=bereketab24
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh
    networks:
      - library-network
    expose:
      - 5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U bereketab24" ]
      interval: 30s
      timeout: 10s
      retries: 5

  mongo:
    image: mongo:6
    volumes:
      - mongo-data:/data/db
    networks:
      - library-network
    expose:
      - 27017
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 30s
      timeout: 10s
      retries: 5

  consul:
    image: hashicorp/consul:latest
    ports:
      - "8500:8500"
    networks:
      - library-network
    expose:
      - 8500
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8500/v1/status/leader" ]
      interval: 30s
      timeout: 10s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    networks:
      - library-network
    expose:
      - 2181

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    networks:
      - library-network
    expose:
      - 9092

networks:
  library-network:
    driver: bridge

volumes:
  postgres-data:
  mongo-data: