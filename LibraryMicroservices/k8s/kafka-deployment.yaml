apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: library
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Add init container to wait for Zookeeper
      initContainers:
        - name: wait-for-zookeeper
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for Zookeeper to be ready..."
              until nc -z zookeeper 2181; do
                echo "Zookeeper not ready, waiting 3 seconds..."
                sleep 3
              done
              echo "Zookeeper is responding!"
              # Extra wait to ensure full initialization
              echo "Waiting additional 15 seconds for Zookeeper to fully initialize..."
              sleep 15
              echo "Ready to start Kafka!"
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.3.0
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: zookeeper:2181
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS
              value: "60000"  # 60 seconds
            - name: KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS
              value: "60000"  # 60 seconds

            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"

            - name: KAFKA_LOG4J_LOGGERS
              value: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"

          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: library
spec:
  ports:
    - port: 9092
      targetPort: 9092
  selector:
    app: kafka