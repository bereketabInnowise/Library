apiVersion: v1
kind: ConfigMap
metadata:
  name: config-server-config
  namespace: library
data:
  application.yml: |
    spring:
      application:
        name: config-server
      cloud:
        config:
          server:
            git:
              uri: https://github.com/bereketabInnowise/config-repo  
              clone-on-start: true
        consul:
          host: consul
          port: 8500
          discovery:
            service-name: config-server
    server:
      port: 8888
    management:
      endpoints:
        web:
          exposure:
            include: health,metrics,info,prometheus
