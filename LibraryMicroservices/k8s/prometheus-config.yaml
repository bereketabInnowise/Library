apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: library
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'config-server'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['config-server:8888']
      - job_name: 'gateway'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['gateway:8080']
      - job_name: 'user-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['user-service:8081']
      - job_name: 'book-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['book-service:8082']
